<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alerts History - Crime Alert System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{url_for('static', filename='detection/alerts.css')}}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
  <div class="card">
    <div class="header-container">
      <div class="header-left">
        <a href="{{ url_for('dashboard') }}" class="back-btn" title="Back to Dashboard"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <h1>Crime Alerts History</h1>
      </div>
    </div>
    
    <div class="table-responsive" id="historyContainer">
      <table id="historyTable">
        <thead>
          <tr>
            <th>Time</th>
            <th>Phone</th>
            <th>Method</th>
            <th>Message</th>
            <th>SID</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/alerts.js') }}"></script>
</body>
</html>
