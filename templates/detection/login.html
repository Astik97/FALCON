<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Crime Alert System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='detection/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Falcon Security Logo">
        </div>
        
        <h1>Login</h1>
        <p class="system-title">Crime Alert & Reporting System</p>
        
        <form id="login-form" method="POST" action="{{ url_for('login') }}">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
            </div>
            
            <div class="input-group">
                <label for="password">Password</label> 
                <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            
            <div id="error-message">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                        <p class="msg-{{ category }}">
                            {{ message }}
                        </p>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            </div>
            
            <button type="submit" class="btn">Login</button>
            <p class="form-link">
                <a href="{{url_for('dashboard')}}">Go to Dashboard</a>
            </p>
        </form>
        <p class="form-link">
            Don't have an account? <a href="{{url_for('register')}}">Register here</a>
        </p>
    </div>
</body>
</html>
